<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 8 92 68" width="20" height="15">
  <!-- WeddingClick Elegant Editorial v1: floral-heart fleuron ornament (the
       Task029 "❧" role, used between family rules and in the Closing).
       Original repository-authored vector geometry; see
       templates/wedding/elegant-editorial/v1/PROVENANCE.md.
       Default colour is the palette moss #47593f. All marks share one colour,
       so it can also be used as a CSS mask and tinted by CSS (e.g. gold in
       the Closing band). -->
