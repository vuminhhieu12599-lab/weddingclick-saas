        d="M112 40 C98 28 86 12 72 12 C62 12 56 20 56 28 C56 33 58 37 62 40 C58 43 56 47 56 52 C56 60 62 68 72 68 C86 68 98 52 112 40 Z
           M66 40 Q86 38.2 104 40 Q86 41.8 66 40 Z"/>
  <!-- Curling stem. -->
