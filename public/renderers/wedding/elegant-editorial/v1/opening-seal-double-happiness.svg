<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 50 98 98" width="196" height="196">
  <!-- WeddingClick Elegant Editorial v1: gold wax seal with the 囍 mark.
       Original repository-authored vector artwork; see
       templates/wedding/elegant-editorial/v1/PROVENANCE.md.
       The 囍 mark is repository-authored vector stroke geometry (no font glyph), so it
       renders identically on every device. Seal centre is (100, 100). -->
  <defs>
    <radialGradient id="ee-seal-wax" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#f1dca8"/>
      <stop offset="0.35" stop-color="#d4b575"/>
      <stop offset="0.75" stop-color="#b99a5b"/>
      <stop offset="1" stop-color="#8c6f4e"/>
    </radialGradient>
    <radialGradient id="ee-seal-disc" cx="0.6" cy="0.65" r="0.8">
      <stop offset="0" stop-color="#d2b474"/>
      <stop offset="0.7" stop-color="#c3a466"/>
      <stop offset="1" stop-color="#a88a52"/>
    </radialGradient>
    <linearGradient id="ee-seal-ring-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbeec9"/>
      <stop offset="0.5" stop-color="#d9bf86" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7a5a24" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="ee-seal-ring-dark" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fbeec9" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7a5a24" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="ee-seal-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="5" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.33  0 0 0 0 0.12  0 0 0 0.1 0" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="in" result="grainIn"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="grainIn"/>
      </feMerge>
    </filter>
  </defs>

